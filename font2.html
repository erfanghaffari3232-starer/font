<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزار تبدیل فونت - ۲۰ فونت متنوع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 25px;
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-area {
            margin-bottom: 25px;
        }

        .input-area label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .input-area textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 20px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0;
            font-size: 13px;
            color: #888;
            flex-wrap: wrap;
        }

        .stats span {
            background: #f8f9fa;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .category-title {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin: 25px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .font-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .font-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
        }

        .font-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border-color: #667eea;
        }

        .font-card.active {
            border-color: #667eea;
            background: #eef1ff;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.25);
        }

        .font-card .preview {
            font-size: 24px;
            margin-bottom: 8px;
            word-break: break-all;
            min-height: 40px;
            line-height: 1.4;
        }

        .font-card .font-name {
            font-size: 11px;
            color: #888;
            background: white;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .font-card .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .font-card.active .badge {
            display: flex;
        }

        .output-area {
            margin-top: 30px;
            border-top: 2px solid #f0f0f0;
            padding-top: 25px;
        }

        .output-area label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .output-box {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .output-box textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 24px;
            resize: vertical;
            min-height: 80px;
            direction: ltr;
            text-align: left;
            font-family: inherit;
        }

        .output-box textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #333;
        }
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(67, 233, 123, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .btn-danger:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: scale(1.05);
        }

        .btn-dark {
            background: #2d3436;
        }
        .btn-dark:hover {
            background: #1a1a1a;
            transform: scale(1.05);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .font-count {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .font-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .output-box {
                flex-direction: column;
            }
            .stats {
                gap: 10px;
            }
            .stats span {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>

    <div class="container">
        <h1>✨ ۲۰ فونت یونیکد</h1>
        <p class="subtitle">متن خود را تایپ کنید و از بین فونت‌های مختلف انتخاب کنید</p>

        <div class="input-area">
            <label>📝 متن خود را وارد کنید:</label>
            <textarea id="inputText" placeholder="مثال: Hello World یا سلام دنیا">𝓯𝓲𝓷𝓲𝓼𝓱</textarea>
        </div>

        <div class="stats">
            <span>📊 کاراکترها: <strong id="charCount">0</strong></span>
            <span>🔤 کلمات: <strong id="wordCount">0</strong></span>
            <span>🔢 فونت‌ها: <strong>۲۰</strong></span>
        </div>

        <div class="search-box">
            <input type="text" id="searchFont" placeholder="🔍 جستجوی فونت...">
        </div>

        <div id="fontContainer">
            <!-- فونت‌ها توسط جاوااسکریپت ساخته می‌شوند -->
        </div>

        <div class="output-area">
            <label>📋 خروجی انتخاب‌شده:</label>
            <div class="output-box">
                <textarea id="outputText" readonly></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="copyOutput()">📋 کپی</button>
                <button class="btn btn-primary" onclick="downloadOutput()">⬇️ دانلود</button>
                <button class="btn btn-danger" onclick="clearAll()">🗑️ پاک</button>
                <button class="btn btn-dark" onclick="resetToOriginal()">↩️ برگشت به اصلی</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

        const outputText = document.getElementById('outputText');
        const fontContainer = document.getElementById('fontContainer');
        const toast = document.getElementById('toast');
        const searchInput = document.getElementById('searchFont');
        let toastTimeout = null;

        // ============ ساخت کارت‌های فونت ============
        function buildFontCards(filter = '') {
            fontContainer.innerHTML = '';
            let totalFonts = 0;

            Object.keys(fontCategories).forEach(category => {
                const fonts = fontCategories[category];
                const filteredFonts = {};

                Object.keys(fonts).forEach(name => {
                    if (name.toLowerCase().includes(filter.toLowerCase())) {
                        filteredFonts[name] = fonts[name];
                    }
                });

                if (Object.keys(filteredFonts).length === 0) return;

                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.textContent = category;
                fontContainer.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'font-grid';

                Object.keys(filteredFonts).forEach((name, index) => {
                    const font = filteredFonts[name];
                    const card = document.createElement('div');
                    card.className = 'font-card';
                    if (totalFonts === 0 && !activeFont) {
                        card.classList.add('active');
                        activeFont = font;
                    }

                    const preview = document.createElement('div');
                    preview.className = 'preview';
                    preview.textContent = convertText('𝓯𝓲𝓷𝓲𝓼𝓱', font);

                    const nameEl = document.createElement('div');
                    nameEl.className = 'font-name';
                    nameEl.textContent = name;

                    const badge = document.createElement('div');
                    badge.className = 'badge';
                    badge.textContent = '✓';

                    card.appendChild(preview);
                    card.appendChild(nameEl);
                    card.appendChild(badge);

                    card.addEventListener('click', function() {
                        document.querySelectorAll('.font-card').forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        activeFont = font;
                        updateOutput();
                        showToast(`✅ فونت "${name}" انتخاب شد`);
                    });

                    grid.appendChild(card);
                    totalFonts++;
                });

                fontContainer.appendChild(grid);
            });

            // اگه هیچ فونتی فعال نباشه، اولین فونت رو فعال کن
            if (!activeFont) {
                const firstCard = document.querySelector('.font-card');
                if (firstCard) {
                    firstCard.classList.add('active');
                    const firstFont = fontCategories[Object.keys(fontCategories)[0]];
                    activeFont = firstFont[Object.keys(firstFont)[0]];
                }
            }

            // بروزرسانی تعداد فونت‌ها
            document.querySelector('.stats span:last-child').innerHTML = `🔢 فونت‌ها: <strong>${totalFonts}</strong>`;
        }

        // ============ تبدیل متن ============
        function convertText(text, fontMap) {
            let result = '';
            for (let char of text) {
                result += fontMap[char] || char;
            }
            return result;
        }

        // ============ بروزرسانی خروجی ============
        function updateOutput() {
            const text = inputText.value || '';
            if (activeFont) {
                outputText.value = convertText(text, activeFont);
            } else {
                outputText.value = text;
            }
            updateStats(text);
        }

        // ============ بروزرسانی آمار ============
        function updateStats(text) {
            document.getElementById('charCount').textContent = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('wordCount').textContent = words;
        }

        // ============ کپی کردن ============
        function copyOutput() {
            const text = outputText.value;
            if (!text) {
                showToast('⚠️ متنی برای کپی وجود ندارد!');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ متن با موفقیت کپی شد!');
            }).catch(() => {
                outputText.select();
                document.execCommand('copy');
                showToast('✅ متن با موفقیت کپی شد!');
            });
        }

        // ============ دانلود فایل ============
        function downloadOutput() {
            const text = outputText.value;
            if (!text) {
                showToast('⚠️ متنی برای دانلود وجود ندارد!');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `font-converted-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ فایل با موفقیت دانلود شد!');
        }

        // ============ پاک کردن ============
        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            updateStats('');
            showToast('🗑️ همه چیز پاک شد!');
        }

        // ============ برگشت به حالت اصلی ============
        function resetToOriginal() {
            if (originalText) {
                inputText.value = originalText;
                updateOutput();
                showToast('↩️ متن به حالت اولیه برگشت');
            } else {
                showToast('⚠️ متنی برای برگشت وجود ندارد');
            }
        }

        // ============ نمایش پیام ============
        function showToast(message) {
            toast.textContent = message;
            toast.style.display = 'block';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // ============ جستجو ============
        searchInput.addEventListener('input', function() {
            buildFontCards(this.value);
            updateOutput();
        });

        // ============ رویدادها ============
        inputText.addEventListener('input', function() {
            if (!originalText && this.value) {
                originalText = this.value;
            }
            updateOutput();
        });

        // ============ اجرا ============
        buildFontCards();
        updateOutput();
        originalText = inputText.value;
