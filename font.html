<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزار تبدیل فونت‌های یونیکد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 25px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-area {
            margin-bottom: 25px;
        }

        .input-area label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .input-area textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #f5576c;
        }

        .font-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .font-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
        }

        .font-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border-color: #f5576c;
        }

        .font-card.active {
            border-color: #f5576c;
            background: #fff0f2;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.2);
        }

        .font-card .preview {
            font-size: 22px;
            margin-bottom: 8px;
            word-break: break-all;
            min-height: 35px;
        }

        .font-card .font-name {
            font-size: 12px;
            color: #888;
            background: white;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .font-card .copy-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f5576c;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .font-card.active .copy-badge {
            display: flex;
        }

        .output-area {
            margin-top: 25px;
            border-top: 2px solid #f0f0f0;
            padding-top: 25px;
        }

        .output-area label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .output-box {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .output-box textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 22px;
            resize: vertical;
            min-height: 80px;
            direction: ltr;
            text-align: left;
            font-family: inherit;
        }

        .output-box textarea:focus {
            outline: none;
            border-color: #f5576c;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: scale(1.05);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #333;
        }

        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(67, 233, 123, 0.4);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0;
            font-size: 13px;
            color: #888;
        }

        .stats span {
            background: #f8f9fa;
            padding: 5px 15px;
            border-radius: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .font-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .output-box {
                flex-direction: column;
            }
        }
    </style>
</head>

        <p class="subtitle">متن خود را تایپ کنید و از بین فونت‌های مختلف انتخاب کنید</p>

        <div class="input-area">

        </div>

        <div class="stats">

        // ============ ساخت کارت‌های فونت ============
        function buildFontCards() {
            fontGrid.innerHTML = '';
            Object.keys(fontStyles).forEach((key, index) => {
                const font = fontStyles[key];
                const card = document.createElement('div');
                card.className = 'font-card';
                if (index === 0) card.classList.add('active');
                
                const preview = document.createElement('div');
                preview.className = 'preview';
                preview.textContent = convertText('𝓯𝓲𝓷𝓲𝓼𝓱', font.letters);
                
                const name = document.createElement('div');
                name.className = 'font-name';
                name.textContent = font.name;
                
                const badge = document.createElement('div');
                badge.className = 'copy-badge';
                badge.textContent = '✓';
                
                card.appendChild(preview);
                card.appendChild(name);
                card.appendChild(badge);
                
                card.addEventListener('click', function() {
                    document.querySelectorAll('.font-card').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    activeFont = font.letters;
                    updateOutput();
                    showToast(`✅ فونت "${font.name}" انتخاب شد`);
                });
                
                fontGrid.appendChild(card);
            });
            
            // فعال کردن اولین فونت
            activeFont = fontStyles[Object.keys(fontStyles)[0]].letters;
        }

        // ============ تبدیل متن ============
        function convertText(text, fontMap) {
            let result = '';
            for (let char of text) {
                result += fontMap[char] || char;
            }
            return result;
        }

        // ============ بروزرسانی خروجی ============
        function updateOutput() {
            const text = inputText.value || '';
            if (activeFont) {
                outputText.value = convertText(text, activeFont);
            } else {
                outputText.value = text;
            }
            updateStats(text);
        }

        // ============ بروزرسانی آمار ============
        function updateStats(text) {
            document.getElementById('charCount').textContent = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('wordCount').textContent = words;
        }

        // ============ کپی کردن ============
        function copyOutput() {
            const text = outputText.value;
            if (!text) {
                showToast('⚠️ متنی برای کپی وجود ندارد!');
                return;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ متن با موفقیت کپی شد!');
            }).catch(() => {
                // روش جایگزین برای مرورگرهای قدیمی
                outputText.select();
                document.execCommand('copy');
                showToast('✅ متن با موفقیت کپی شد!');
            });
        }

        // ============ دانلود فایل ============
        function downloadOutput() {
            const text = outputText.value;
            if (!text) {
                showToast('⚠️ متنی برای دانلود وجود ندارد!');
                return;
            }
            
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `font-converted-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ فایل با موفقیت دانلود شد!');
        }

        // ============ پاک کردن ============
        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            updateStats('');
            showToast('🗑️ همه چیز پاک شد!');
        }

        // ============ نمایش پیام ============
        function showToast(message) {
            toast.textContent = message;
            toast.style.display = 'block';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // ============ رویدادها ============
        inputText.addEventListener('input', updateOutput);

        // ============ اجرا ============
        buildFontCards();
        updateOutput();
    </script>
</body>
</html>
