<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>واکی تاکی من</title>
<style>
  body {
    background: #1a2a1a;
    font-family: Tahoma, sans-serif;
    text-align: center;
    color: #0f0;
    padding: 20px;
  }
  h1 { font-size: 28px; }
  .radio {
    background: #333;
    border: 8px solid #555;
    border-radius: 20px;
    padding: 20px;
    max-width: 350px;
    margin: 20px auto;
    box-shadow: 0 0 20px #0f0;
  }
  #screen {
    background: #000;
    color: #0f0;
    border: 3px solid #0a0;
    border-radius: 10px;
    padding: 15px;
    min-height: 80px;
    font-size: 18px;
    margin-bottom: 15px;
  }
  button {
    background: #c00;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 20px;
    border-radius: 50%;
    width: 120px;
    height: 120px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 5px #800;
  }
  button:active {
    transform: translateY(5px);
    box-shadow: 0 0 #800;
  }
</style>
</head>
<body>

<h1>📻 واکی تاکی</h1>

<div class="radio">
  <div id="screen">آماده برای ارسال...</div>
  <button onclick="sendMessage()">فشار بده</button>
</div>

<script>
  const messages = [
    "آلفا یک، آلفا یک، موقعیت رو اعلام کن. تمام.",
    "دریافت شد. تمام.",
    "کمک لازم دارم، تکرار می‌کنم، کمک لازم دارم!",
    "دشمن دیده شد، سمت شمال!",
    "عقب‌نشینی کنید، تکرار می‌کنم، عقب‌نشینی!",
    "همه چیز امن است. تمام.",
    "پیام دریافت شد، در حال حرکت هستم.",
    "وضعیت قرمز! وضعیت قرمز!"
  ];

  let audioCtx;
  let noiseNode;

  function playStatic() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = audioCtx.sampleRate * 0.8;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.15;
    noiseNode.connect(gain);
    gain.connect(audioCtx.destination);
    noiseNode.start();
  }

  function sendMessage() {
    const screen = document.getElementById("screen");

    // صدای بیپ شروع
    if (!audioCtx) playStatic();

    screen.textContent = "📡 در حال ارسال...";
    screen.style.color = "#ff0";

    setTimeout(() => {
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      screen.textContent = "🔊 " + randomMsg;
      screen.style.color = "#0f0";
    }, 600);

    setTimeout(() => {
      screen.textContent = "آماده برای ارسال...";
      screen.style.color = "#0f0";
    }, 4000);
  }
</script>

</body>
  </html>
