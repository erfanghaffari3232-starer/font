<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عکس + نقاشی</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:Tahoma;background:#0f172a;overflow:hidden;display:flex;flex-direction:column;height:100vh;color:white}
        
        .header{background:#1e293b;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1);flex-wrap:wrap;gap:5px}
        .header h1{font-size:1rem;color:#38bdf8}
        .header button{background:#334155;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;font-family:Tahoma;margin-left:5px;transition:0.2s}
        .header button.active{background:#38bdf8;color:#000}
        .header button.danger{background:#e94560}
        .header button.green{background:#4ade80;color:#000}
        .header button.save{background:#fbbf24;color:#000;font-weight:bold}
        
        .main-area{flex:1;position:relative;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center}
        canvas#drawCanvas{position:absolute;width:100%;height:100%;z-index:10;cursor:crosshair;touch-action:none}
        
        .controls{bottom:0;width:100%;background:#1e293b;padding:10px;display:flex;flex-direction:column;gap:8px;z-index:20}
        
        .tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;justify-content:center}
        .tools::-webkit-scrollbar{display:none}
        .tool-btn{background:#334155;color:white;border:none;padding:8px 12px;border-radius:8px;font-size:1.2rem;cursor:pointer;transition:0.2s;flex-shrink:0}
        .tool-btn.active{background:#38bdf8;color:#000}
        
        .colors{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;justify-content:center}
        .colors::-webkit-scrollbar{display:none}
        .color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:0.2s}
        .color-btn.active{border-color:white;transform:scale(1.1)}
        
        .sliders{display:flex;gap:10px;align-items:center;justify-content:center;padding:0 10px}
        .sliders label{font-size:0.75rem;color:#94a3b8;white-space:nowrap}
        .sliders input[type=range]{flex:1;accent-color:#38bdf8}
        
        .msg{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:10px 20px;border-radius:10px;z-index:30;font-size:0.85rem;text-align:center;display:none;white-space:nowrap}
        .msg.show{display:block}
        
        #fileInput{display:none}
    </style>
</head>
<body>

<div class="header">
    <h1>🖼️ عکس + نقاشی</h1>
    <div>
        <!-- دکمه انتخاب عکس (مجوز فایل) -->
        <button class="green" onclick="document.getElementById('fileInput').click()">📁 انتخاب عکس</button>
        
        <!-- دکمه‌های ابزار (بعد از انتخاب عکس فعال می‌شن) -->
        <button id="btnUndo" onclick="undo()" style="display:none">↩️</button>
        <button id="btnClear" onclick="clearCanvas()" class="danger" style="display:none">🗑️</button>
        
        <!-- دکمه ذخیره (مجوز دانلود) -->
        <button id="btnSave" class="save" onclick="saveImage()" style="display:none">💾 ذخیره</button>
    </div>
</div>

<!-- اینپوت فایل، وقتی دکمه بالا زده میشه، پنجره انتخاب فایل باز میشه و مرورگر مجوز می‌خواد -->
<input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">

<div class="main-area">
    <canvas id="drawCanvas"></canvas>
    <div class="msg" id="msg">یک عکس از گالری انتخاب کنید</div>
</div>

<div class="controls" id="controlsPanel" style="display:none">
    <div class="tools">
        <button class="tool-btn active" data-tool="pen" onclick="setTool('pen')">✏️</button>
        <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser')">🧹</button>
    </div>
    <div class="colors" id="colorPalette">
        <div class="color-btn active" style="background:#e94560" onclick="setColor(this, '#e94560')"></div>
        <div class="color-btn" style="background:#38bdf8" onclick="setColor(this, '#38bdf8')"></div>
        <div class="color-btn" style="background:#4ade80" onclick="setColor(this, '#4ade80')"></div>
        <div class="color-btn" style="background:#fbbf24" onclick="setColor(this, '#fbbf24')"></div>
        <div class="color-btn" style="background:#a855f7" onclick="setColor(this, '#a855f7')"></div>
        <div class="color-btn" style="background:#ffffff" onclick="setColor(this, '#ffffff')"></div>
        <div class="color-btn" style="background:#000000" onclick="setColor(this, '#000000')"></div>
    </div>
    <div class="sliders">
        <label>اندازه:</label>
        <input type="range" id="brushSize" min="2" max="30" value="5">
    </div>
</div>

<script>
var canvas = document.getElementById('drawCanvas');
var ctx = canvas.getContext('2d');
var msg = document.getElementById('msg');
var controls = document.getElementById('controlsPanel');
var btnUndo = document.getElementById('btnUndo');
var btnClear = document.getElementById('btnClear');
var btnSave = document.getElementById('btnSave');

var isDrawing = false;
var currentTool = 'pen';
var currentColor = '#e94560';
var brushSize = 5;
var strokes = [];
var loadedImage = null;

function resizeCanvas() {
    const parent = canvas.parentElement;
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight;
    redrawCanvas();
}
window.addEventListener('resize', resizeCanvas);

// وقتی کاربر عکس انتخاب می‌کنه، این تابع اجرا میشه (مرورگر مجوز فایل رو داده)
function loadImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    
    var reader = new FileReader();
    reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
            loadedImage = img;
            controls.style.display = 'flex';
            btnUndo.style.display = 'inline-block';
            btnClear.style.display = 'inline-block';
            btnSave.style.display = 'inline-block'; // دکمه ذخیره نمایان میشه
            msg.classList.remove('show');
            strokes = [];
            resizeCanvas();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = ''; 
}

// ذخیره عکس نهایی (مرورگر برای دانلود مجوز می‌خواد)
function saveImage() {
    if (!loadedImage) return;
    var link = document.createElement('a');
    link.download = 'my-drawing-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function setTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.tool-btn[data-tool="${tool}"]`).classList.add('active');
}

function setColor(btn, color) {
    currentColor = color;
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function redrawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (loadedImage) {
        const canvasRatio = canvas.width / canvas.height;
        const imgRatio = loadedImage.width / loadedImage.height;
        let drawW, drawH, offsetX, offsetY;

        if (canvasRatio > imgRatio) {
            drawH = canvas.height;
            drawW = loadedImage.width * (canvas.height / loadedImage.height);
            offsetX = (canvas.width - drawW) / 2;
            offsetY = 0;
        } else {
            drawW = canvas.width;
            drawH = loadedImage.height * (canvas.width / loadedImage.width);
            offsetX = 0;
            offsetY = (canvas.height - drawH) / 2;
        }
        ctx.drawImage(loadedImage, offsetX, offsetY, drawW, drawH);
    }
    
    drawStrokes();
}

function drawStrokes() {
    strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        ctx.beginPath();
        if (stroke.tool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = stroke.size * 3;
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = stroke.color;
            ctx.lineWidth = stroke.size;
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
    });
}

function undo() {
    if (strokes.length > 0) {
        strokes.pop();
        redrawCanvas();
    }
}

function clearCanvas() {
    if (confirm('همه نقاشی‌ها پاک شود؟')) {
        strokes = [];
        redrawCanvas();
    }
}

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('touchmove', handleMove, {passive: false});
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('touchend', handleEnd);
canvas.addEventListener('mouseup', handleEnd);
canvas.addEventListener('mouseleave', handleEnd);

function handleStart(e) {
    e.preventDefault();
    if (!loadedImage) return;
    isDrawing = true;
    const pos = getMousePos(e);
    const newStroke = {
        tool: currentTool,
        color: currentColor,
        size: parseInt(document.getElementById('brushSize').value),
        points: [pos]
    };
    strokes.push(newStroke);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, newStroke.size/2, 0, Math.PI*2);
    if (newStroke.tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
    } else {
        ctx.fillStyle = currentColor;
    }
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
}

function handleMove(e) {
    e.preventDefault();
    if (!isDrawing || strokes.length === 0) return;
    const pos = getMousePos(e);
    const currentStroke = strokes[strokes.length - 1];
    currentStroke.points.push(pos);
    ctx.beginPath();
    const prev = currentStroke.points[currentStroke.points.length - 2];
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(pos.x, pos.y);
    if (currentStroke.tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = currentStroke.size * 3;
    } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentStroke.color;
        ctx.lineWidth = currentStroke.size;
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
}

function handleEnd(e) {
    if (e) e.preventDefault();
    isDrawing = false;
}
</script>

</body>
    </html>
